databases:
  - name: timegrid-db
    plan: free
    databaseName: timegrid
    user: timegrid

services:
  - type: web
    name: timegrid
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    envVars:
      - key: APP_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: timegrid-db
          property: connectionString
      - key: CACHE_DRIVER
        value: array
      - key: SESSION_DRIVER
        value: cookie
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: MAIL_DRIVER
        value: log
