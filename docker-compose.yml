# WO-014 — Compose topology: app (php-fpm), nginx, mysql, redis, queue worker.
services:
  app:
    build:
      context: .
      target: app
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_ENV: local
      DB_HOST: mysql
      DB_DATABASE: timegrid
      DB_USERNAME: timegrid
      DB_PASSWORD: timegrid
      REDIS_HOST: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_DRIVER: redis

  queue:
    build:
      context: .
      target: app
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3"]
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis
    environment:
      DB_HOST: mysql
      DB_DATABASE: timegrid
      DB_USERNAME: timegrid
      DB_PASSWORD: timegrid
      REDIS_HOST: redis
      QUEUE_DRIVER: redis

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: timegrid
      MYSQL_USER: timegrid
      MYSQL_PASSWORD: timegrid
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - timegrid_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  timegrid_mysql:
